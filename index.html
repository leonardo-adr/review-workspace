const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d(S),iterations:N,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(I)},k,d(C));
  return new TextDecoder().decode(pt);
}
async function run(pw,remember){
  try{ const h=await open(pw); if(remember) try{sessionStorage.setItem("ws-pw",pw)}catch(e){}
    const fr=document.createElement("iframe"); fr.title="Workspace";
    fr.style.cssText="position:fixed;inset:0;width:100%;height:100%;border:0;background:#F4F6F7";
    fr.srcdoc=h; document.body.innerHTML=""; document.body.appendChild(fr);
    fr.addEventListener("load",()=>{ try{ fr.contentDocument.title && (document.title=fr.contentDocument.title); }catch(e){} }); }
  catch(e){ try{sessionStorage.removeItem("ws-pw")}catch(_){} document.getElementById("err").textContent="Wrong password. Check it and try again."; document.getElementById("go").disabled=false; document.getElementById("go").textContent="Open workspace"; }
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault(); const g=document.getElementById("go"); g.disabled=true; g.textContent="Opening…"; run(document.getElementById("pw").value,true);});
try{const p=sessionStorage.getItem("ws-pw"); if(p) run(p,false);}catch(e){}
